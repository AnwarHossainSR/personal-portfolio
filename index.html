<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Md. Anwar Hossain - Senior Software Engineer</title>
    <meta
      name="description"
      content="Build backends. Move them to AWS. Automate the release. Keep it running."
    />
    <meta name="author" content="Md. Anwar Hossain" />

    <!-- Kept in step with the active theme by src/hooks/useTheme.ts. -->
    <meta name="theme-color" content="#0c0a08" />

    <!--
      Theme before first paint. Mirrors src/hooks/useTheme.ts: the stored
      choice wins only when it was made under the current default version,
      so bumping THEME_DEFAULT_VERSION there must be mirrored here.
    -->
    <script>
      (() => {
        try {
          const current =
            localStorage.getItem("theme-default-version") === "dark-v2";
          let theme = current ? localStorage.getItem("theme") : "dark";
          if (theme === "system") {
            const prefersLight = matchMedia(
              "(prefers-color-scheme: light)",
            ).matches;
            theme = prefersLight ? "light" : "dark";
          }
          const light = theme === "light";
          document.documentElement.className = light ? "light" : "dark";
          // The browser chrome too, or a light page sits under dark chrome
          // until React loads. The meta element is above this script.
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", light ? "#faf9f6" : "#0c0a08");
        } catch {
          // Storage is blocked: keep the dark default already on <html>.
        }
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Md. Anwar Hossain - Senior Software Engineer"
    />
    <meta
      property="og:description"
      content="Build backends. Move them to AWS. Automate the release. Keep it running."
    />
    <meta
      property="og:image"
      content="https://anwarportfolio.vercel.app/og.png"
    />
    <meta property="og:url" content="https://anwarportfolio.vercel.app" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Md. Anwar Hossain - Senior Software Engineer"
    />
    <meta
      name="twitter:description"
      content="Build backends. Move them to AWS. Automate the release. Keep it running."
    />
    <meta
      name="twitter:image"
      content="https://anwarportfolio.vercel.app/og.png"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Additional SEO -->
    <link rel="canonical" href="https://anwarportfolio.vercel.app" />
    <meta name="robots" content="index, follow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
